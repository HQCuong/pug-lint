name: CI

# Pushes to main and pull requests: a PR branch runs once (as the pull_request event), not twice.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
        os: [ubuntu-latest, windows-latest]
    env:
      # Wall-clock budgets in the tests are multiplied by this; shared runners are slower and noisier.
      PUG_LINT_TIME_SCALE: ${{ matrix.os == 'windows-latest' && '3' || '2' }}
    steps:
      # Keep CRLF fixtures byte-exact on Windows (.gitattributes pins them too).
      - run: git config --global core.autocrlf true
        if: matrix.os == 'windows-latest'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # pnpm's version comes from the root `packageManager` field.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm -C packages/eslint-plugin compat:check
      - run: pnpm -C packages/eslint-plugin docs:check

  # The lowest supported ESLint 9 / eslint-plugin-vue / vue-eslint-parser.
  floor:
    name: floor (eslint 9.15, eslint-plugin-vue 10.0)
    runs-on: ubuntu-latest
    env:
      PUG_LINT_TIME_SCALE: '2'
      # eslint-plugin-vue 10.0.0 predates ESLint 10 support, so only the `eslint9` entry runs.
      PUG_LINT_ESLINT: '9'
      # The crashing-rule list is measured against current versions; an older eslint-plugin-vue may differ.
      PUG_LINT_SKIP_COMPAT_DRIFT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm -C packages/eslint-plugin add -D eslint9@npm:eslint@9.15.0 eslint-plugin-vue@10.0.0 vue-eslint-parser@10.0.0
      # The compat suite measures eslint-plugin-vue on ESLint 10 (the `eslint` package, not the
      # `eslint9` alias); eslint-plugin-vue 10.0 predates ESLint 10 and its rules fail to load there.
      # It is meant for current versions only (compat-latest.yml covers the newest).
      - run: pnpm -C packages/eslint-plugin exec vitest run --exclude 'tests/compat/**'

  # The Cloudflare deploy builds the site after merge; catch dead links and broken pages first.
  docs:
    name: docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Every translation has every page, the English code blocks and anchors, and in-language links.
      - run: node docs/scripts/check-locales.mjs
      - run: pnpm docs:build
