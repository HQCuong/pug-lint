name: Release

# Versions and publishes the packages with changesets. On every push to main:
#
# - `version`: when changesets are pending, opens or updates the "Version Packages" pull request
#   (version bumps + CHANGELOG.md per package). Nothing is published.
# - `build`: when no changeset is pending, finds the packages whose version is not on npm yet,
#   checks them and packs their tarballs, with read-only permissions.
# - `publish`: publishes those tarballs and creates a GitHub release per package. It never
#   installs dependencies, and is the only job that can mint an OIDC token.
#
# npm auth uses Trusted Publishing (OIDC): no token is stored. Each package must list this repo +
# `release.yml` as its trusted publisher on npmjs.com. See "Releasing" in CONTRIBUTING.md.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Version Packages pull request
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the changeset-release/main branch
      pull-requests: write # open the Version Packages pull request
    outputs:
      has-changesets: ${{ steps.changesets.outputs.hasChangesets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # This job can write to the repo, so no dependency install script runs here.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version: pnpm exec changeset version
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ github.token }}

  build:
    name: Build unpublished versions
    needs: version
    if: needs.version.outputs.has-changesets == 'false'
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.pending.outputs.packages }}
      node-version: ${{ steps.pending.outputs.node-version }}
    env:
      PUG_LINT_TIME_SCALE: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Dependencies first: the parser is published before the plugin that depends on it.
      - name: Find versions that are not on npm
        id: pending
        run: |
          pending=""
          for dir in packages/pug-parser packages/eslint-plugin; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if [ "$version" = "0.0.0" ]; then
              echo "$name: 0.0.0 is a placeholder, skipping."
            elif npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already on npm."
            else
              echo "$name@$version will be published."
              pending="$pending $dir"
            fi
          done
          echo "packages=${pending# }" >> "$GITHUB_OUTPUT"
          echo "node-version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"

      - if: steps.pending.outputs.packages != ''
        run: pnpm install --frozen-lockfile

      - name: Check
        if: steps.pending.outputs.packages != ''
        run: |
          pnpm build
          pnpm lint
          pnpm typecheck
          pnpm test

      - name: Pack and extract release notes
        if: steps.pending.outputs.packages != ''
        run: |
          mkdir release
          for dir in ${{ steps.pending.outputs.packages }}; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            slug=$(basename "$dir")
            # pnpm pack replaces `workspace:*` with the real version.
            pnpm -C "$dir" pack --pack-destination "$PWD/release"
            mv release/*-"$version".tgz "release/$slug.tgz"
            # The section of CHANGELOG.md for this version: from `## <version>` to the next `## `.
            awk -v v="## $version" '$0 == v { on = 1; next } /^## / { on = 0 } on' "$dir/CHANGELOG.md" > "release/$slug.md"
            echo "$name" > "release/$slug.name"
            echo "$version" > "release/$slug.version"
          done
          ls -l release

      - if: steps.pending.outputs.packages != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    if: needs.build.outputs.packages != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tags and GitHub releases
      id-token: write # npm Trusted Publishing (OIDC) + provenance
    env:
      PACKAGES: ${{ needs.build.outputs.packages }}
    steps:
      # No checkout in this job, so .nvmrc is not on disk: take the version from build.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ needs.build.outputs.node-version }}
          registry-url: https://registry.npmjs.org

      - name: Check npm supports Trusted Publishing
        run: |
          # Trusted Publishing needs npm >= 11.5.1.
          npm --version
          node -e "const [a,b,c]=process.argv[1].split('.').map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)" "$(npm --version)" \
            || npm install -g npm@^11.5.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      - name: Publish to npm
        run: |
          for dir in $PACKAGES; do
            slug=$(basename "$dir")
            name=$(cat "release/$slug.name")
            version=$(cat "release/$slug.version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already on npm, skipping publish (re-run)."
              continue
            fi
            case "$version" in
              *-*) npm publish "release/$slug.tgz" --access public --provenance --tag next ;;
              *) npm publish "release/$slug.tgz" --access public --provenance ;;
            esac
          done

      - name: Create GitHub releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for dir in $PACKAGES; do
            slug=$(basename "$dir")
            version=$(cat "release/$slug.version")
            tag="$(cat "release/$slug.name")@$version"
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Release $tag already exists, skipping."
              continue
            fi
            flags=""
            case "$version" in *-*) flags="--prerelease" ;; esac
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "$tag" --notes-file "release/$slug.md" $flags
          done
